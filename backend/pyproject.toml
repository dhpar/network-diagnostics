[project]
name = "Netwatch"
version = "0.1.0"
description = "Locally-hosted web app for diagnosing and monitoring network issues in real-time, device discovery, WiFi scanning, DNS testing, and WebSocket-based live updates."
readme = "README.md"
authors = [
    { name = "D", email = "davhern@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "netifaces2>=0.0.22",
    "bcrypt==5.0.0",
    "blinker==1.9.0"
    "cffi==2.1.0",
    "click==8.4.2",
    "colorama==0.4.6",
    "cryptography==49.0.0",
    "debugpy==1.8.21",
    "dotenv==0.9.9",
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "invoke==3.0.3",
    "itsdangerous==2.2.0",
    "jc==1.25.7",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "netifaces2==0.0.22",
    "paramiko==5.0.0",
    "pycparser==3.0",
    "pygments==2.20.0",
    "pynacl==1.6.2",
    "python-dotenv==1.2.2",
    "ruamel-yaml==0.19.1",
    "scapy==2.7.0",
    "werkzeug==3.1.8",
    "xmltodict==1.0.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
