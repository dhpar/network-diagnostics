[project]
name = "Netwatch"
version = "0.1.0"
description = "Locally-hosted web app for diagnosing and monitoring network issues in real-time, device discovery, WiFi scanning, DNS testing, and WebSocket-based live updates."
readme = "README.md"
authors = [
    { name = "D", email = "davhern@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "netifaces2>=0.0.22",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
